<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frog Catcher! 🐸</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #050811;
            color: white;
            margin: 0;
            padding: 15px;
            /* Verhindert sinnloses Markieren beim schnellen Tippen */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        h1 { 
            color: #00d2ff; 
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); 
            font-size: 1.8rem;
            margin-top: 10px;
        }
        .stats {
            font-size: 20px;
            margin: 15px;
            color: #64a3b8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 12px;
            max-width: 360px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .box {
            aspect-ratio: 1 / 1; /* Macht die Boxen immer perfekt quadratisch */
            background-color: #111625;
            border: 2px solid #1a243c;
            border-radius: 15px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            /* Verhindert graue Klick-Schleier auf iOS */
            -webkit-tap-highlight-color: transparent; 
        }
        .box:active { background-color: #1c293b; border-color: #00d2ff; }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #1c293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { background-color: #00d2ff; color: #0b0e14; box-shadow: 0 0 15px #00d2ff; }
        button:disabled { background-color: #111625; border-color: #1a243c; color: #444; cursor: not-allowed; box-shadow: none; }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
        }
        
        /* Optimierung für kleinere Handys */
        @media (max-width: 380px) {
            .box { font-size: 32px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <h1>Frog Catcher! 🐸</h1>
    
    <div class="stats">
        <span>Punkte: <strong id="score" style="color: #00d2ff;">0</strong></span> | 
        <span>Zeit: <strong id="time" style="color: #00d2ff;">15</strong>s</span>
    </div>

    <button id="start-btn" onclick="startGame()">Spiel starten</button>

    <div class="grid">
        <div class="box" id="1" onclick="catchFrog(1)"></div>
        <div class="box" id="2" onclick="catchFrog(2)"></div>
        <div class="box" id="3" onclick="catchFrog(3)"></div>
        <div class="box" id="4" onclick="catchFrog(4)"></div>
        <div class="box" id="5" onclick="catchFrog(5)"></div>
        <div class="box" id="6" onclick="catchFrog(6)"></div>
        <div class="box" id="7" onclick="catchFrog(7)"></div>
        <div class="box" id="8" onclick="catchFrog(8)"></div>
        <div class="box" id="9" onclick="catchFrog(9)"></div>
    </div>

    <a href="/spiele-hub" class="back-link">⬅ Zurück zum Spiele-Hub</a>

    <script>
        let score = 0;
        let timeLeft = 15;
        let frogPosition = null;
        let gameInterval;
        let frogInterval;

        function startGame() {
            score = 0;
            timeLeft = 15;
            document.getElementById("score").innerText = score;
            document.getElementById("time").innerText = timeLeft;
            document.getElementById("start-btn").disabled = true;

            clearGrid();

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("time").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    clearInterval(frogInterval);
                    clearGrid();
                    alert("Zeit abgelaufen! Deine Punkte: " + score);
                    document.getElementById("start-btn").disabled = false;
                }
            }, 1000);

            moveFrog();
            frogInterval = setInterval(moveFrog, 750); // Tick schneller fürs Handy!
        }

        function moveFrog() {
            clearGrid();
            let randomId = Math.floor(Math.random() * 9) + 1;
            let targetBox = document.getElementById(randomId);
            if (targetBox) {
                targetBox.innerText = "🐸";
                frogPosition = randomId;
            }
        }

        function clearGrid() {
            for (let i = 1; i <= 9; i++) {
                let box = document.getElementById(i);
                if (box) box.innerText = "";
            }
        }

        function catchFrog(clickedId) {
            if (timeLeft > 0 && clickedId === frogPosition) {
                score++;
                document.getElementById("score").innerText = score;
                let box = document.getElementById(clickedId);
                if (box) box.innerText = "";
                frogPosition = null; 
            }
        }
    </script>
</body>
</html>
