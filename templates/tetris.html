<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEFANS SPIELE | Cyber-Tetris 🧱</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00d2ff;
            margin: 10px 0;
            text-shadow: 0 0 15px #00d2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
        }

        .game-container {
            display: flex;
            gap: 15px;
            background-color: #11141a;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            max-width: 100%;
            box-sizing: border-box;
        }

        canvas {
            background-color: #05070a;
            border: 2px solid #1e2530;
            max-width: 100%;
            height: auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-width: 110px;
            font-family: 'Orbitron', sans-serif;
        }

        .info-box {
            background-color: #0d0f12;
            border: 1px solid #1e2530;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .info-title {
            color: #94a3b8;
            font-size: 0.7rem;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .info-value {
            color: #00d2ff;
            font-size: 1.2rem;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
        }

        #nextCanvas {
            background-color: #05070a;
            border: 1px solid #1e2530;
            margin: 5px auto 0 auto;
            display: block;
        }

        .controls-info {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: left;
            line-height: 1.4;
        }

        /* Virtuelles Steuerkreuz unten für Handys */
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 15px;
        }

        .mobile-btn {
            background-color: #11141a;
            border: 2px solid #00d2ff;
            color: #00d2ff;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            touch-action: manipulation;
            user-select: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            cursor: pointer;
        }

        .mobile-btn:active {
            background-color: #00d2ff;
            color: #05070a;
            box-shadow: 0 0 15px #00d2ff;
        }

        .back-btn {
            margin-top: 15px;
            display: inline-block;
            background-color: #1e2530;
            color: #94a3b8;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background-color: #00d2ff;
            color: #05070a;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            .controls-info {
                display: none;
            }
        }
    </style>
</head>
<body>

    <h1>Cyber-Tetris</h1>

    <div class="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>

        <div class="sidebar">
            <div>
                <div class="info-box">
                    <div class="info-title">Score</div>
                    <div id="score" class="info-value">0</div>
                </div>
                <div class="info-box">
                    <div class="info-title">Linien</div>
                    <div id="lines" class="info-value">0</div>
                </div>
                <div class="info-box">
                    <div class="info-title">Nächstes</div>
                    <canvas id="nextCanvas" width="72" height="72"></canvas>
                </div>
            </div>

            <div class="info-box controls-info">
                <div class="info-title" style="margin-bottom: 5px;">Steuerung</div>
                ⬅️ ➡️ : Bewegen<br>
                ⬆️ : Drehen<br>
                ⬇️ : Fall<br>
                Leertaste: Drop
            </div>
        </div>
    </div>

    <!-- Das Touch-Steuerkreuz -->
    <div class="mobile-controls">
        <button class="mobile-btn" id="btn-rot">🔄</button>
        <button class="mobile-btn" id="btn-up">⬆️</button>
        <button class="mobile-btn" id="btn-drop">⚡</button>
        <button class="mobile-btn" id="btn-left">⬅️</button>
        <button class="mobile-btn" id="btn-down">⬇️</button>
        <button class="mobile-btn" id="btn-right">➡️</button>
    </div>

    <a href="/spiele-hub" class="back-btn">⬅️ Zum Spiele-Hub</a>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(24, 24);

        const nextCanvas = document.getElementById('nextCanvas');
        const nextContext = nextCanvas.getContext('2d');
        nextContext.scale(18, 14);

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
            lines: 0
        };

        const colors = [
            null, '#ff0055', '#00f0ff', '#ffcc00', '#ff3300', '#00ff66', '#aa00ff', '#ff6600'
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) { matrix.push(new Array(w).fill(0)); }
            return matrix;
        }

        // FEHLER BEHOBEN: Hier sind jetzt die echten Tetris-Formen sauber drin!
        function createPiece(type) {
            if (type === 'T') {
                return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            } else if (type === 'I') {
                return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
            } else if (type === 'O') {
                return [[3, 3], [3, 3]];
            } else if (type === 'Z') {
                return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
            } else if (type === 'S') {
                return [[0, 5, 5], [5, 5, 0], [0, 0, 0]];
            } else if (type === 'J') {
                return [[0, 6, 0], [0, 6, 0], [6, 6, 0]];
            } else if (type === 'L') {
                return [[0, 7, 0], [0, 7, 0], [0, 7, 7]];
            }
        }

        function drawMatrix(matrix, offset, ctx) {
            if (!matrix) return;
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);

            nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            drawMatrix(player.next, {x: 1, y: 1}, nextContext);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) { arena[y + player.pos.y][x + player.pos.x] = value; }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) { return true; }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) { continue outer; }
                }
                const row = arena.splice(y, 1).fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                player.lines++;
                rowCount *= 2;
            }
            updateScore();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerInstantDrop() {
            while (!collide(arena, player)) { player.pos.y++; }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
