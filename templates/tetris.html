<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEFANS SPIELE | Cyber-Tetris 🧱</title>
    <style>
        @import url('https://googleapis.com');
        body { background-color: #05070a; color: #ffffff; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 10px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        h1 { font-family: 'Orbitron', sans-serif; color: #00d2ff; margin: 10px 0; text-shadow: 0 0 15px #00d2ff; text-transform: uppercase; font-size: 2rem; }
        .game-container { display: flex; gap: 15px; background-color: #11141a; padding: 15px; border-radius: 16px; border: 2px solid #00d2ff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); max-width: 100%; box-sizing: border-box; position: relative; }
        canvas { background-color: #05070a; border: 2px solid #1e2530; max-width: 100%; height: auto; }
        .sidebar { display: flex; flex-direction: column; min-width: 110px; font-family: 'Orbitron', sans-serif; }
        .info-box { background-color: #0d0f12; border: 1px solid #1e2530; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .info-title { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; }
        .info-value { color: #00d2ff; font-size: 1.2rem; font-weight: 900; }
        .controls-info { font-size: 0.75rem; color: #94a3b8; text-align: left; }
        .mobile-controls { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; margin-top: 15px; }
        .mobile-btn { background-color: #11141a; border: 2px solid #00d2ff; color: #00d2ff; border-radius: 12px; padding: 15px; font-size: 1.5rem; font-weight: bold; touch-action: manipulation; user-select: none; }
        .mobile-btn:active { background-color: #00d2ff; color: #05070a; }
        .back-btn { margin-top: 15px; display: inline-block; background-color: #1e293b; color: #00d2ff; border: 2px solid #00d2ff; text-decoration: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-family: 'Orbitron', sans-serif; }
        @media (max-width: 768px) { .mobile-controls { display: grid; } .controls-info { display: none; } }
    </style>
</head>
<body>

    <h1>Cyber-Tetris</h1>

    <div class="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>
        <div class="sidebar">
            <div class="info-box">
                <div class="info-title">Score</div>
                <div id="score" class="info-value">0</div>
            </div>
            <div class="info-box">
                <div class="info-title">Linien</div>
                <div id="lines" class="info-value">0</div>
            </div>
            <div class="info-box controls-info">
                <div class="info-title">Steuerung</div>
                An den PC-Pfeiltasten oder über Touch-Buttons zocken!
            </div>
        </div>
    </div>

    <div class="mobile-controls">
        <button class="mobile-btn" id="btn-rot">🔄</button>
        <button class="mobile-btn" id="btn-up">⬆️</button>
        <button class="mobile-btn" id="btn-drop">⚡</button>
        <button class="mobile-btn" id="btn-left">⬅️</button>
        <button class="mobile-btn" id="btn-down">⬇️</button>
        <button class="mobile-btn" id="btn-right">➡️</button>
    </div>

    <a href="/spiele-hub" class="back-btn">⬅️ Zum Spiele-Hub</a>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(24, 24);

        const arena = Array.from({length: 20}, () => Array(10).fill(0));
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0, lines: 0 };
        const colors = [null, '#ff0055', '#00f0ff', '#ffcc00', '#ff3300', '#00ff66', '#aa00ff', '#ff6600'];
        let gameOver = false;

        // BOMBENSICHER: Robuste Datenstruktur, die beim Kopieren nicht mehr kaputtgehen kann!
        function createPiece(type) {
            if (type === 'T') return [[0,0,0],[1,1,1],[0,1,0]];
            if (type === 'I') return [[0,2,0,0],[0,2,0,0],[0,2,0,0],[0,2,0,0]];
            if (type === 'O') return [[3,3],[3,3]];
            if (type === 'Z') return [[4,4,0],[0,4,4],[0,0,0]];
            if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
            if (type === 'J') return [[0,6,0],[0,6,0],[6,6,0]];
            if (type === 'L') return [[0,7,0],[0,7,0],[0,7,7]];
        }

        function drawMatrix(matrix, offset) {
            if (!matrix) return;
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#05070a';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);

            if (gameOver) {
                context.fillStyle = 'rgba(255, 0, 85, 0.85)';
                context.fillRect(0, 0, 10, 20);
                context.fillStyle = '#ffffff';
                context.font = '1px "Orbitron"';
                context.textAlign = 'center';
                context.fillText('GAME OVER', 5, 10);
            }
        }

        function merge() {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) { arena[y + player.pos.y][x + player.pos.x] = value; }
                });
            });
        }

        function collide() {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) { return true; }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            for (let y = arena.length - 1; y > 0; --y) {
                if (arena[y].every(value => value !== 0)) {
                    arena.splice(y, 1);
                    arena.unshift(Array(10).fill(0));
                    ++y;
                    player.score += rowCount * 10;
                    player.lines++;
                    rowCount *= 2;
                }
            }
            document.getElementById('score').innerText = player.score;
            document.getElementById('lines').innerText = player.lines;
        }

        function playerDrop() {
            if (gameOver) return;
            player.pos.y++;
            if (collide()) {
                player.pos.y--;
                merge();
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (gameOver) return;
            player.pos.x += dir;
            if (collide()) { player.pos.x -= dir; }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (10 / 2 | 0) - (player.matrix.length / 2 | 0);
            
            if (collide()) {
                gameOver = true;
                setTimeout(() => {
                    arena.forEach(row => row.fill(0));
                    player.score = 0;
                    player.lines = 0;
                    document.getElementById('score').innerText = 0;
                    document.getElementById('lines').innerText = 0;
                    gameOver = false;
                    playerReset();
                }, 3000);
            }
        }

        function playerRotate() {
            if (gameOver) return;
            const pos = player.pos.x;
            let offset = 1;
            for (let y = 0; y < player.matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [player.matrix[x][y], player.matrix[y][x]] = [player.matrix[y][x], player.matrix[x][y]];
                }
            }
            player.matrix.forEach(row => row.reverse());
            while (collide()) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix.length) {
                    player.matrix.forEach(row => row.reverse());
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let lastTime = 0;
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > 1000 && !gameOver) { playerDrop(); }
            draw();
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) playerMove(-1);
            if (event.keyCode === 39) playerMove(1);
            if (event.keyCode === 40) playerDrop();
            if (event.keyCode === 38) playerRotate();
        });

        document.getElementById('btn-left').addEventListener('click', () => playerMove(-1));
        document.getElementById('btn-right').addEventListener('click', () => playerMove(1));
        document.getElementById('btn-down').addEventListener('click', () => playerDrop());
        document.getElementById('btn-up').addEventListener('click', () => playerRotate());
        document.getElementById('btn-rot').addEventListener('click', () => playerRotate());
