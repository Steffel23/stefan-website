<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>STEFANS SPIELE | Infinite Jump 🦘</title>
    <style>
        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        h1 {
            color: #00d2ff;
            margin: 5px 0;
            text-transform: uppercase;
            font-size: 1.8rem;
        }
        #game-canvas {
            background-color: #0d1117;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            max-width: 100%;
            max-height: 60vh;
            cursor: pointer;
        }
        .score-box {
            font-size: 1.3rem;
            color: #00d2ff;
            margin: 8px 0;
        }
        .mobile-hint {
            display: none;
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 10px;
        }
        .back-btn {
            margin-top: 15px;
            display: inline-block;
            background-color: #1e293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body>

    <h1>Infinite Jump</h1>
    <div id="score" class="score-box">Score: 0</div>

    <!-- Das gesamte Spielfeld reagiert am Handy als riesiger Touch-Button -->
    <canvas id="game-canvas" width="400" height="500"></canvas>
    
    <div class="mobile-hint">📱 Tippe einfach auf den Bildschirm zum Springen!</div>

    <br>
    <a href="/spiele-hub" class="back-btn">⬅ Zum Hub</a>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');

            let score = 0;
            let gameOver = false;
            let gravity = 0.6;

            const player = {
                x: 50,
                y: 200,
                width: 30,
                height: 30,
                velocity: 0,
                jumpForce: -10,
                // Springen auslösen
                jump: function() {
                    if (gameOver) {
                        resetGame();
                    } else {
                        this.velocity = this.jumpForce;
                    }
                }
            };

            let obstacles = [];
            let obstacleTimer = 0;

            // PC-Steuerung (Leertaste oder Pfeil-Nach-Oben)
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
                    e.preventDefault();
                    player.jump();
                }
            });

            // Handy-Steuerung (Tippen direkt auf das Spielfeld)
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                player.jump();
            });
            // Falls man am PC lieber mit der Maus klickt
            canvas.addEventListener('mousedown', () => {
                player.jump();
            });

            function spawnObstacle() {
                obstacleTimer++;
                if (obstacleTimer > 90) {
                    const height = Math.random() * 150 + 50;
                    obstacles.push({
                        x: 400,
                        y: 500 - height,
                        width: 30,
                        height: height,
                        speed: 4
                    });
                    obstacleTimer = 0;
                }
            }

            function checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            function resetGame() {
                score = 0;
                obstacles = [];
                gameOver = false;
                player.y = 200;
                player.velocity = 0;
                document.getElementById('score').innerText = "Score: " + score;
            }

            function update() {
                if (gameOver) return;

                // Schwerkraft auf Spieler anwenden
                player.velocity += gravity;
                player.y += player.velocity;

                // Boden- und Deckenkollision
                if (player.y + player.height > 500) {
                    player.y = 500 - player.height;
                    player.velocity = 0;
                }
                if (player.y < 0) {
                    player.y = 0;
                    player.velocity = 0;
                }

                // Hindernisse bewegen
                spawnObstacle();
                obstacles.forEach((obs, index) => {
                    obs.x -= obs.speed;

                    // Wenn das Hindernis links raus ist -> Punkt kassieren
                    if (obs.x + obs.width < 0) {
                        obstacles.splice(index, 1);
                        score += 1;
                        document.getElementById('score').innerText = "Score: " + score;
                    }

                    // Crash mit Hindernis
                    if (checkCollision(player, obs)) {
                        gameOver = true;
                    }
                });
            }

            function draw() {
                ctx.clearRect(0, 0, 400, 500);

                // Spieler zeichnen (Neon Cyan)
                ctx.fillStyle = '#00d2ff';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Rote Cyber-Hindernisse zeichnen
                ctx.fillStyle = '#ff0055';
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                });

                if (gameOver) {
                    ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
                    ctx.fillRect(0, 0, 400, 500);
                    ctx.fillStyle = '#ff0055';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', 200, 230);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '16px Arial';
                    ctx.fillText('Tippe auf das Feld zum Neustart', 200, 270);
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            resetGame();
            loop();
        };
    </script>
</body>
</html>
