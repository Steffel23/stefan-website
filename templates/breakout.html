<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Breakout! 🧱</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #050811;
            color: white;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Verhindert, dass das Handy die Seite herumbewegt */
        }
        h1 { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); margin: 5px 0; font-size: 1.8rem; }
        #score-board { font-size: 20px; color: #64a3b8; margin-bottom: 10px; }
        canvas {
            background: #111625;
            display: block;
            margin: 0 auto;
            border: 2px solid #1a243c;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.1);
            max-width: 100%;
            touch-action: none;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #1c293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { background-color: #00d2ff; color: #0b0e14; box-shadow: 0 0 15px #00d2ff; }
        .back-link { display: inline-block; margin-top: 15px; color: #00d2ff; text-decoration: none; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

    <h1>Neon Breakout! 🧱</h1>
    <div id="score-board">Score: <strong id="score" style="color: #00d2ff;">0</strong> | Leben: <strong id="lives" style="color: #ff0055;">3</strong></div>
    
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <br>
    <button id="start-btn" onclick="resetGame()">Spiel Starten</button>
    <br>
    <a href="/spiele-hub" class="back-link">⬅ Zurück zum Spiele-Hub</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let gameRunning = false;

        // Ball Eigenschaften
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 2.5;
        let dy = -2.5;
        const ballRadius = 8;

        // Schläger Eigenschaften (Etwas breiter fürs Handy)
        const paddleHeight = 12;
        const paddleWidth = 90; 
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // Blöcke Eigenschaften
        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;

        let bricks = [];

        function initBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                bricks[c] = [];
                for(let r=0; r<brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        // 🕹️ Steuerung für PC (A / D und Pfeiltasten)
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        
        // 📱 Perfekte Steuerung für Handys (Finger-Tracking)
        canvas.addEventListener("touchstart", touchHandler, { passive: false });
        canvas.addEventListener("touchmove", touchHandler, { passive: false });

        function keyDownHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = true;
        }

        function keyUpHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = false;
        }

        function touchHandler(e) {
            if(!gameRunning) return;
            e.preventDefault(); // Verhindert Scrollen beim Zocken
            
            // Berechnet exakt, wo der Finger auf dem Spielfeld ist
            const rect = canvas.getBoundingClientRect();
            const root = document.documentElement;
            const touch = e.touches[0];
            
            // Rechnet die Bildschirm-Pixel auf die Spiel-Pixel um
            let relativeX = (touch.clientX - rect.left) / (rect.right - rect.left) * canvas.width;
            
            if(relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function collisionDetection() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        if(x > b.x && x < b.x+brickWidth && y > b.y && y < b.y+brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            document.getElementById("score").innerText = score;
                            if(score === brickRowCount * brickColumnCount) {
                                alert("Gewonnen, Bro! Mega Leistung! 🎉");
                                gameRunning = false;
                                document.getElementById("start-btn").style.display = "inline-block";
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#00d2ff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00d2ff";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ffffff";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            const colors = ["#ff0055", "#00ffcc", "#ffcc00"];
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    if(bricks[c][r].status === 1) {
                        let brickX = (c*(brickWidth+brickPadding))+brickOffsetLeft;
                        let brickY = (r*(brickHeight+brickPadding))+brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = colors[r % colors.length];
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = colors[r % colors.length];
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if(!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height-ballRadius) {
                if(x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                }
                else {
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    if(!lives) {
                        alert("Game Over, Bro! 💥");
                        gameRunning = false;
                        document.getElementById("start-btn").style.display = "inline-block";
                    }
                    else {
                        x = canvas.width/2;
                        y = canvas.height-30;
                        dx = 2.5;
                        dy = -2.5;
                        paddleX = (canvas.width-paddleWidth)/2;
                    }
                }
            }

            if(rightPressed && paddleX < canvas.width-paddleWidth) paddleX += 5;
            else if(leftPressed && paddleX > 0) paddleX -= 5;

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        function resetGame() {
            document.getElementById("start-btn").style.display = "none";
            score = 0;
            lives = 3;
            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 2.5;
            dy = -2.5;
            paddleX = (canvas.width - paddleWidth) / 2;
            initBricks();
            if(!gameRunning) {
                gameRunning = true;
                draw();
            }
        }
        
        initBricks();
    </script>
</body>
</html>
