<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>STEFANS SPIELE | Server Raid Defense 🛡️</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00d2ff;
            margin: 5px 0;
            text-shadow: 0 0 15px #00d2ff;
            text-transform: uppercase;
            font-size: 1.8rem;
        }

        .hud {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #00d2ff;
            margin: 8px 0;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
        }

        #game-canvas {
            background-color: #0b0f17;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            max-width: 100%;
            max-height: 55vh;
            cursor: pointer;
        }

        /* Komplett blaue Cyber-Shop-Buttons */
        .shop {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        .shop-btn {
            flex: 1;
            background-color: #0d111a;
            border: 2px solid #0055ff;
            color: #00d2ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.2);
        }

        .shop-btn.active {
            background-color: #0055ff;
            color: #ffffff;
            border-color: #00ffff;
            box-shadow: 0 0 20px #0055ff, 0 0 30px #00ffff;
            text-shadow: 0 0 5px #ffffff;
        }

        .back-btn {
            margin-top: 15px;
            display: inline-block;
            background-color: #1e293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
        }
        .back-btn:hover {
            background-color: #00d2ff;
            color: #05070a;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <h1>Server Raid Defense</h1>
    <div class="hud">
        <div id="money">Data-Packs: 150</div>
        <div id="hp">Mainframe-HP: 10</div>
        <div id="wave">Welle: 1</div>
    </div>

    <canvas id="game-canvas" width="600" height="400"></canvas>

    <div class="shop">
        <button class="shop-btn active" id="btn-fw">Firewall (50⟁)</button>
        <button class="shop-btn" id="btn-am">Auto-Mod (90⟁)</button>
    </div>

    <a href="/spiele-hub" class="back-btn">⬅ Zum Hub</a>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');

            let money = 150;
            let hp = 10;
            let wave = 1;
            let gameOver = false;

            let selectedTowerType = 'firewall';

            const path = [
                {x: 0, y: 200}, {x: 150, y: 200}, {x: 150, y: 70}, 
                {x: 350, y: 70}, {x: 350, y: 320}, {x: 500, y: 320}, {x: 500, y: 200}, {x: 600, y: 200}
            ];

            let enemies = [];
            let towers = [];
            let projectiles = [];
            let spawnTimer = 0;
            let waveTimer = 0;
            let enemiesToSpawn = 5;

            document.getElementById('btn-fw').addEventListener('click', function() {
                selectedTowerType = 'firewall';
                this.classList.add('active');
                document.getElementById('btn-am').classList.remove('active');
            });
            document.getElementById('btn-am').addEventListener('click', function() {
                selectedTowerType = 'automod';
                this.classList.add('active');
                document.getElementById('btn-fw').classList.remove('active');
            });

            canvas.addEventListener('click', function(e) {
                if (gameOver) { resetGame(); return; }
                
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;

                let cost = selectedTowerType === 'firewall' ? 50 : 90;
                if (money >= cost) {
                    towers.push({
                        x: clickX,
                        y: clickY,
                        type: selectedTowerType,
                        range: selectedTowerType === 'firewall' ? 100 : 140,
                        cooldown: 0,
                        maxCooldown: selectedTowerType === 'firewall' ? 25 : 12
                    });
                    money -= cost;
                    updateHUD();
                }
            });

            function updateHUD() {
                document.getElementById('money').innerText = "Data-Packs: " + money;
                document.getElementById('hp').innerText = "Mainframe-HP: " + hp;
                document.getElementById('wave').innerText = "Welle: " + wave;
            }

            function spawnEnemy() {
                if (enemiesToSpawn > 0) {
                    spawnTimer++;
                    if (spawnTimer > 50) {
                        enemies.push({
                            pathIndex: 0,
                            x: path[0].x,
                            y: path[0].y,
                            speed: 1.4 + (wave * 0.12),
                            hp: 20 + (wave * 18),
                            maxHp: 20 + (wave * 18),
                            size: 14
                        });
                        enemiesToSpawn--;
                        spawnTimer = 0;
                    }
                } else if (enemies.length === 0) {
                    waveTimer++;
                    if (waveTimer > 150) {
                        wave++;
                        enemiesToSpawn = 5 + wave;
                        waveTimer = 0;
                        updateHUD();
                    }
                }
            }

            function resetGame() {
                money = 150;
                hp = 10;
                wave = 1;
                gameOver = false;
                enemies = [];
                towers = [];
                projectiles = [];
                enemiesToSpawn = 5;
                updateHUD();
            }

            function update() {
                if (gameOver) return;

                spawnEnemy();

                enemies.forEach((enemy, eIndex) => {
                    const target = path[enemy.pathIndex + 1];
                    const dx = target.x - enemy.x;
                    const dy = target.y - enemy.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < enemy.speed) {
                        enemy.pathIndex++;
                        if (enemy.pathIndex >= path.length - 1) {
                            hp--;
                            enemies.splice(eIndex, 1);
                            updateHUD();
                            if (hp <= 0) gameOver = true;
                            return;
                        }
                    } else {
                        enemy.x += (dx / dist) * enemy.speed;
                        enemy.y += (dy / dist) * enemy.speed;
                    }
                });

                towers.forEach(tower => {
                    if (tower.cooldown > 0) tower.cooldown--;

                    if (tower.cooldown === 0) {
                        let target = null;
                        let bestDist = tower.range;

                        enemies.forEach(enemy => {
                            const tdx = enemy.x - tower.x;
                            const tdy = enemy.y - tower.y;
                            const tdist = Math.sqrt(tdx*tdx + tdy*tdy);
                            if (tdist < bestDist) {
                                bestDist = tdist;
                                target = enemy;
                            }
                        });

                        if (target) {
                            projectiles.push({
                                x: tower.x,
                                y: tower.y,
                                target: target,
                                speed: 7,
                                damage: tower.type === 'firewall' ? 12 : 6,
                                type: tower.type
                            });
                            tower.cooldown = tower.maxCooldown;
                        }
                    }
                });

                projectiles.forEach((proj, pIndex) => {
                    if (!enemies.includes(proj.target)) {
                        projectiles.splice(pIndex, 1);
                        return;
                    }
