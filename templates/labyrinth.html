<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>STEFANS SPIELE | Cyber Rocket 🚀</title>
    <style>
        @import url('https://googleapis.com');
        body { background-color: #030508; color: #ffffff; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 10px; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; }
        h1 { font-family: 'Orbitron', sans-serif; color: #00d2ff; margin: 5px 0; text-shadow: 0 0 15px #00d2ff; text-transform: uppercase; font-size: 1.8rem; }
        .score-box { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #00d2ff; margin: 8px 0; text-shadow: 0 0 5px rgba(0, 210, 255, 0.5); }
        .canvas-container { width: 100%; max-width: 400px; position: relative; }
        canvas { background-color: #05070a; border: 2px solid #00d2ff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); border-radius: 12px; width: 100%; height: auto; display: block; cursor: pointer; }
        .hint { color: #94a3b8; font-size: 1rem; margin-top: 10px; }
        .back-btn { margin-top: 15px; display: inline-block; background-color: #1e293b; color: #00d2ff; border: 2px solid #00d2ff; text-decoration: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <h1>Cyber Rocket</h1>
    <div id="score" class="score-box">Score: 0</div>

    <div class="canvas-container">
        <canvas id="game-canvas" width="400" height="500"></canvas>
    </div>
    
    <div class="hint">📱 Tippe auf das Feld / 💻 Drücke Leertaste zum Fliegen!</div>

    <a href="/spiele-hub" class="back-btn">⬅ Zum Hub</a>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');

            let score = 0;
            let gameOver = false;
            let gravity = 0.25;

            const bird = {
                x: 50,
                y: 200,
                w: 34,
                h: 24,
                velocity: 0,
                lift: -6,
                flap: function() {
                    if (gameOver) {
                        resetGame();
                    } else {
                        this.velocity = this.lift;
                    }
                }
            };

            let pipes = [];
            let pipeTimer = 0;

            // PC-Steuerung
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    bird.flap();
                }
            });

            // Mobile Handy-Steuerung & Maus-Klicks
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                bird.flap();
            });
            canvas.addEventListener('mousedown', () => {
                bird.flap();
            });

            function spawnPipe() {
                pipeTimer++;
                if (pipeTimer > 100) {
                    const gap = 130; // Durchflugs-Lücke
                    const topHeight = Math.random() * (canvas.height - gap - 100) + 30;
                    pipes.push({
                        x: canvas.width,
                        top: topHeight,
                        bottom: canvas.height - topHeight - gap,
                        w: 50,
                        speed: 2.5,
                        passed: false
                    });
                    pipeTimer = 0;
                }
            }

            function resetGame() {
                score = 0;
                pipes = [];
                gameOver = false;
                bird.y = 200;
                bird.velocity = 0;
                document.getElementById('score').innerText = "Score: " + score;
            }

            function update() {
                if (gameOver) return;

                bird.velocity += gravity;
                bird.y += bird.velocity;

                // Decken- und Bodenkollision
                if (bird.y + bird.h > canvas.height || bird.y < 0) {
                    gameOver = true;
                }

                spawnPipe();

                pipes.forEach((pipe, index) => {
                    pipe.x -= pipe.speed;

                    // Kollisions-Prüfung mit den Röhren
                    if (bird.x + bird.w > pipe.x && bird.x < pipe.x + pipe.w) {
                        if (bird.y < pipe.top || bird.y + bird.h > canvas.height - pipe.bottom) {
                            gameOver = true;
                        }
                    }

                    // Score erhöhen
                    if (!pipe.passed && pipe.x + pipe.w < bird.x) {
                        score++;
                        pipe.passed = true;
                        document.getElementById('score').innerText = "Score: " + score;
                    }

                    if (pipe.x + pipe.w < 0) {
                        pipes.splice(index, 1);
                    }
                });
            }

            function draw() {
                // Hintergrund löschen
                ctx.fillStyle = '#05070a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Neon-Blaue Röhren zeichnen
                ctx.fillStyle = '#0055ff';
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 2;
                
                pipes.forEach(pipe => {
                    // Obere Röhre
                    ctx.fillRect(pipe.x, 0, pipe.w, pipe.top);
                    ctx.strokeRect(pipe.x, 0, pipe.w, pipe.top);
                    
                    // Untere Röhre
                    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.w, pipe.bottom);
                    ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipe.w, pipe.bottom);
                });

                // Deine Cyber-Rakete zeichnen (Neon-Cyanes Dreieck)
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(bird.x + bird.w, bird.y + bird.h / 2);
                ctx.lineTo(bird.x, bird.y);
                ctx.lineTo(bird.x, bird.y + bird.h);
                ctx.closePath();
                ctx.fill();

                // Antriebsfeuer (Rot)
                if (!gameOver && Math.random() > 0.4) {
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(bird.x - 6, bird.y + bird.h / 2 - 3, 6, 6);
                }

                if (gameOver) {
                    ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ff0055';
                    ctx.font = '26px "Orbitron"';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '16px "Rajdhani"';
                    ctx.fillText('Tippe auf das Feld für Neustart', canvas.width / 2, canvas.height / 2 + 20);
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            resetGame();
            loop();
        };
    </script>
</body>
</html>
