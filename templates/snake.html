<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEFANS SPIELE - Snake</title>
    <style>
        body {
            background-color: #030811;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            touch-action: none;
            overflow: hidden;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00D2FF;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin: 10px 0;
            font-size: 1.8rem;
        }
        .score-board {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #8f9db1;
        }
        #game-container {
            margin: 10px auto;
            position: relative;
            max-width: 90vw;
            width: 400px;
        }
        canvas {
            background-color: #111a2d;
            border: 2px solid #00D2FF;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            display: block;
            width: 100%;
            height: auto;
        }
        .hint-text {
            font-size: 0.9rem;
            color: #576574;
            margin-top: 5px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #111a2d;
            color: #00D2FF;
            border: 2px solid #00D2FF;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #00D2FF;
            color: #111a2d;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <h1>Retro Snake</h1>
    <div class="score-board">Punkte: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>
    
    <div class="hint-text">Steuerung: WASD / Pfeiltasten & Wischen am Handy</div>
    <a href="/spiele-hub" class="back-btn">Zurück zum Spielehub</a>

    <script>
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const grid = 20;
        let count = 0;
        let score = 0;
        
        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [{x: 160, y: 160}, {x: 140, y: 160}],
            maxCells: 4
        };

        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function resetGame() {
            snake.x = 160;
            snake.y = 160;
            snake.cells = [{x: 160, y: 160}, {x: 140, y: 160}];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            score = 0;
            scoreElement.textContent = score;
            apple.x = getRandomInt(0, 20) * grid;
            apple.y = getRandomInt(0, 20) * grid;
        }

        function loop() {
            requestAnimationFrame(loop);

            if (++count < 6) { return; }
            count = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
                resetGame();
            }

            snake.cells.unshift({x: snake.x, y: snake.y});

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            ctx.fillStyle = '#ff4a4a';
            ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            ctx.fillStyle = '#00D2FF';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10;
                    scoreElement.textContent = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        resetGame();
                    }
                }
            });
        }

        // WASD & Pfeiltasten
        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if ((e.which === 37 || key === 'a') && snake.dx === 0) {
                snake.dx = -grid; snake.dy = 0;
            } else if ((e.which === 38 || key === 'w') && snake.dy === 0) {
                snake.dy = -grid; snake.dx = 0;
            } else if ((e.which === 39 || key === 'd') && snake.dx === 0) {
                snake.dx = grid; snake.dy = 0;
            } else if ((e.which === 40 || key === 's') && snake.dy === 0) {
                snake.dy = grid; snake.dx = 0;
            }
        });

        // Handy-Wischgesten (Touch)
        let touchstartX = 0; let touchstartY = 0;
        let touchendX = 0; let touchendY = 0;

        document.addEventListener('touchstart', function(e) {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            e.preventDefault(); 
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleSwipe();
        }, {passive: false});

        function handleSwipe() {
            const xDiff = touchendX - touchstartX;
            const yDiff = touchendY - touchstartY;
            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 30 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
                else if (xDiff < -30 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            } else {
                if (yDiff > 30 && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
                else if (yDiff < -30 && snake.dy === 0) { snake.dx = 0; snake.dy = -grid; }
            }
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
