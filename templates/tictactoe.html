<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tic-Tac-Toe ❌⭕</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #050811;
            color: white;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); margin: 10px 0; font-size: 1.8rem; }
        #status { font-size: 20px; color: #64a3b8; margin-bottom: 15px; height: 25px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 12px;
            justify-content: center;
            margin: 20px auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #111625;
            border: 2px solid #1a243c;
            border-radius: 12px;
            font-size: 45px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .cell:active { background-color: #1c293b; }
        .cell.X { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .cell.O { color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #1c293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background-color: #00d2ff; color: #0b0e14; box-shadow: 0 0 15px #00d2ff; }
        .back-link { display: inline-block; margin-top: 25px; color: #00d2ff; text-decoration: none; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

    <h1>Cyber Tic-Tac-Toe ❌⭕</h1>
    <div id="status">Du bist dran (❌)</div>

    <div class="grid">
        <div class="cell" id="0" onclick="makeMove(0)"></div>
        <div class="cell" id="1" onclick="makeMove(1)"></div>
        <div class="cell" id="2" onclick="makeMove(2)"></div>
        <div class="cell" id="3" onclick="makeMove(3)"></div>
        <div class="cell" id="4" onclick="makeMove(4)"></div>
        <div class="cell" id="5" onclick="makeMove(5)"></div>
        <div class="cell" id="6" onclick="makeMove(6)"></div>
        <div class="cell" id="7" onclick="makeMove(7)"></div>
        <div class="cell" id="8" onclick="makeMove(8)"></div>
    </div>

    <button onclick="resetGame()">Spiel Neustarten</button>
    <br>
    <a href="/spiele-hub" class="back-link">⬅ Zurück zum Spiele-Hub</a>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;
        const statusDisplay = document.getElementById("status");

        const winPatterns = [, [3, 4, 5], [6, 7, 8], // Zeilen, [1, 4, 7], [2, 5, 8], // Spalten, [2, 4, 6]             // Diagonalen
        ];

        function makeMove(index) {
            if (board[index] !== "" || !gameActive) return;

            // Spieler-Zug (X)
            board[index] = "X";
            updateCell(index, "X");

            if (checkWin("X")) {
                statusDisplay.innerText = "Du hast gewonnen! 🎉";
                gameActive = false;
                return;
            }

            if (board.every(cell => cell !== "")) {
                statusDisplay.innerText = "Unentschieden! 🤝";
                gameActive = false;
                return;
            }

            // Bot-Zug (O) verzögert für Realismus
            gameActive = false;
            statusDisplay.innerText = "Bot überlegt... 🤖";
            setTimeout(botMove, 500);
        }

        function botMove() {
            // Einfache Bot-Logik: Sucht freien Platz
            let emptyCells = [];
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") emptyCells.push(i);
            }

            if (emptyCells.length > 0) {
                let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomIndex] = "O";
                updateCell(randomIndex, "O");

                if (checkWin("O")) {
                    statusDisplay.innerText = "Der Bot hat gewonnen! 🤖💥";
                    gameActive = false;
                    return;
                }

                if (board.every(cell => cell !== "")) {
                    statusDisplay.innerText = "Unentschieden! 🤝";
                    gameActive = false;
                    return;
                }

                gameActive = true;
                statusDisplay.innerText = "Du bist dran (❌)";
            }
        }

        function updateCell(index, player) {
            let cell = document.getElementById(index);
            cell.innerText = player;
            cell.classList.add(player);
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            statusDisplay.innerText = "Du bist dran (❌)";
            for (let i = 0; i < 9; i++) {
                let cell = document.getElementById(i);
                cell.innerText = "";
                cell.classList.remove("X", "O");
            }
        }
    </script>
</body>
</html>
