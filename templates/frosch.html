<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEFANS SPIELE - Frog Catcher</title>
    <style>
        body {
            background-color: #030811;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            touch-action: none;
            overflow: hidden;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00D2FF;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin: 10px 0;
            font-size: 1.8rem;
        }
        .score-board {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #8f9db1;
        }
        #game-container {
            margin: 10px auto;
            position: relative;
            max-width: 90vw;
            width: 400px;
        }
        canvas {
            background-color: #111a2d;
            border: 2px solid #00D2FF;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            display: block;
            width: 100%;
            height: auto;
        }
        .hint-text {
            font-size: 0.9rem;
            color: #576574;
            margin-top: 5px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #111a2d;
            color: #00D2FF;
            border: 2px solid #00D2FF;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #00D2FF;
            color: #111a2d;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <h1>Frog Catcher</h1>
    <div class="score-board">Punkte: <span id="score">0</span> | Leben: <span id="lives">3</span></div>

    <div id="game-container">
        <canvas id="frogCanvas" width="400" height="400"></canvas>
    </div>
    
    <div class="hint-text">Steuerung: A / D oder Pfeiltasten am PC | Links/Rechts tippen am Handy</div>
    <a href="/spiele-hub" class="back-btn">Zurück zum Spielehub</a>

    <script>
        const canvas = document.getElementById("frogCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const livesElement = document.getElementById("lives");

        let score = 0;
        let lives = 3;
        let gameOver = false;

        // Frosch (Spieler) Eigenschaften
        const frog = {
            width: 50,
            height: 30,
            x: 175,
            y: 350,
            speed: 7,
            dx: 0
        };

        // Fliegen (Ziele) Array
        let flies = [];
        const flySpeed = 3;

        function spawnFly() {
            if (gameOver) return;
            const x = Math.random() * (canvas.width - 20) + 10;
            flies.push({ x: x, y: 0, radius: 8 });
            // Zufälliges nächstes Spawn-Intervall
            setTimeout(spawnFly, Math.random() * 1000 + 800);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            flies = [];
            frog.x = 175;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
        }

        // Tastensteuerung (PC)
        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.keyCode === 37) frog.dx = -frog.speed;
            if (key === 'd' || e.keyCode === 39) frog.dx = frog.speed;
            if (gameOver && e.keyCode === 32) resetGame(); // Leertaste für Neustart
        });

        document.addEventListener('keyup', function(e) {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.keyCode === 37 || key === 'd' || e.keyCode === 39) {
                frog.dx = 0;
            }
        });

        // Touchsteuerung (Handy)
        canvas.addEventListener('touchstart', function(e) {
            if (gameOver) {
                resetGame();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const canvasWidthRelative = rect.width;

            // Wenn in der linken Hälfte getippt wird -> nach links, sonst rechts
            if (touchX < canvasWidthRelative / 2) {
                frog.dx = -frog.speed;
            } else {
                frog.dx = frog.speed;
            }
        }, {passive: true});

        canvas.addEventListener('touchend', function() {
            frog.dx = 0;
        }, {passive: true});

        function update() {
            if (!gameOver) {
                // Frosch bewegen
                frog.x += frog.dx;

                // Grenzen einhalten
                if (frog.x < 0) frog.x = 0;
                if (frog.x + frog.width > canvas.width) frog.x = canvas.width - frog.width;

                // Fliegen bewegen und prüfen
                for (let i = flies.length - 1; i >= 0; i--) {
                    flies[i].y += flySpeed;

                    // Kollision mit Frosch (Kopfbereich des Frosches)
                    if (flies[i].x > frog.x && 
                        flies[i].x < frog.x + frog.width && 
                        flies[i].y + flies[i].radius > frog.y && 
                        flies[i].y - flies[i].radius < frog.y + frog.height) {
                        
                        flies.splice(i, 1);
                        score += 10;
                        scoreElement.textContent = score;
                        continue;
                    }

                    // Boden berührt (Fliege entkommen)
                    if (flies[i].y > canvas.height) {
                        flies.splice(i, 1);
                        lives--;
                        livesElement.textContent = lives;

                        if (lives <= 0) {
                            gameOver = true;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = '#ff4a4a';
                ctx.font = '30px Orbitron, sans-serif';
                ctx.fillText("GAME OVER", 110, 180);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.fillText("Tippe oder drücke Leertaste zum Neustart", 60, 220);
                return;
            }

            // Fliegen zeichnen (als kleine goldene Kreise/Glühwürmchen)
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FFD700';
            flies.forEach(fly => {
                ctx.beginPath();
                ctx.arc(fly.x, fly.y, fly.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0; // Shadow-Reset

            // Frosch zeichnen (Neon-Grün)
            ctx.fillStyle = '#00FF66';
            // Körper
            ctx.beginPath();
            ctx.ellipse(frog.x + 25, frog.y + 15, 25, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Augen
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(frog.x + 15, frog.y + 5, 6, 0, Math.PI * 2);
            ctx.arc(frog.x + 35, frog.y + 5, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#030811';
            ctx.beginPath();
            ctx.arc(frog.x + 15, frog.y + 5, 3, 0, Math.PI * 2);
            ctx.arc(frog.x + 35, frog.y + 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Spiel starten
        spawnFly();
        gameLoop();
    </script>
</body>
</html>
