<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>STEFANS SPIELE | Space Shooter 🚀</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00d2ff;
            margin: 5px 0;
            text-shadow: 0 0 15px #00d2ff;
            text-transform: uppercase;
            font-size: 1.8rem;
        }

        #game-canvas {
            background-color: #020408;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            max-width: 100%;
            max-height: 60vh;
        }

        .score-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #00d2ff;
            margin: 8px 0;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
        }

        /* Das fette mobile Steuerkreuz (erscheint nur auf Handys) */
        .mobile-layout {
            display: none;
            width: 100%;
            max-width: 360px;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            background-color: #11141a;
            border: 2px solid #00d2ff;
            color: #00d2ff;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.4rem;
            font-weight: bold;
            touch-action: manipulation;
            user-select: none;
            cursor: pointer;
        }

        .action-btn:active {
            background-color: #00d2ff;
            color: #05070a;
            box-shadow: 0 0 15px #00d2ff;
        }

        .shoot-btn {
            grid-column: span 3;
            background-color: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
        }

        .shoot-btn:active {
            background-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 15px #ff0055;
        }

        .back-btn {
            margin-top: 15px;
            display: inline-block;
            background-color: #1e293b;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .mobile-layout {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <h1>Space Shooter</h1>
    <div id="score" class="score-box">Punkte: 0</div>

    <canvas id="game-canvas" width="400" height="500"></canvas>

    <!-- Mobile Touch-Buttons -->
    <div class="mobile-layout">
        <button class="action-btn" id="left-btn">⬅️</button>
        <button class="action-btn" id="empty-btn" style="visibility:hidden;"></button>
        <button class="action-btn" id="right-btn">➡️</button>
        <button class="action-btn shoot-btn" id="fire-btn">🔥 FEUER 🚀</button>
    </div>

    <a href="/spiele-hub" class="back-btn">⬅️ Zum Hub</a>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gameOver = false;

        // Spieler-Schiff
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 6,
            movingLeft: false,
            movingRight: false
        };

        let lasers = [];
        let enemies = [];
        let enemySpawnTimer = 0;

        // Tastatur-Steuerung für den PC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.movingLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') player.movingRight = true;
            if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') fireLaser();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.movingLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') player.movingRight = false;
        });

        // Handy Touch-Events verknüpfen
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const fireBtn = document.getElementById('fire-btn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); player.movingLeft = true; });
        leftBtn.addEventListener('touchend', () => player.movingLeft = false);
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); player.movingRight = true; });
        rightBtn.addEventListener('touchend', () => player.movingRight = false);
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });

        function fireLaser() {
            if (gameOver) {
                resetGame();
                return;
            }
            lasers.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 15, speed: 8 });
        }

        function spawnEnemy() {
            enemySpawnTimer++;
            if (enemySpawnTimer > 40) {
                const size = Math.random() * 20 + 20;
                enemies.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: Math.random() * 2 + 2
                });
                enemySpawnTimer = 0;
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function resetGame() {
            score = 0;
            lasers = [];
            enemies = [];
            gameOver = false;
            player.x = canvas.width / 2 - 20;
            document.getElementById('score').innerText = "Punkte: " + score;
        }

        function update() {
            if (gameOver) return;

            // Schiff bewegen
            if (player.movingLeft && player.x > 0) player.x -= player.speed;
            if (player.movingRight && player.x < canvas.width - player.width) player.x += player.speed;

            // Laser bewegen
            lasers.forEach((laser, index) => {
                laser.y -= laser.speed;
                if (laser.y < 0) lasers.splice(index, 1);
            });

            // Gegner spawnen & bewegen
            spawnEnemy();
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;
                
                // Kollision mit Spieler (Game Over)
                if (checkCollision(player, enemy)) {
                    gameOver = true;
                }

                if (enemy.y > canvas.height) enemies.splice(eIndex, 1);

                // Kollision mit Lasern
                lasers.forEach((laser, lIndex) => {
                    if (checkCollision(laser, enemy)) {
                        enemies.splice(eIndex, 1);
                        lasers.splice(lIndex, 1);
                        score += 10;
                        document.getElementById('score').innerText = "Punkte: " + score;
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Spieler zeichnen (Neon Blau)
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Laser zeichnen (Neon Cyan)
            ctx.fillStyle = '#00ffff';
            lasers.forEach(laser => ctx.fillRect(laser.x, laser.y, laser.width, laser.height));

            // Gegner zeichnen (Neon Rot)
            ctx.fillStyle = '#ff0055';
            enemies.forEach(enemy => ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height));

            if (gameOver) {
                ctx.fillStyle = 'rgba(5, 7, 10, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0055';
                ctx.font = '24px "Orbitron"';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px "Rajdhani"';
                ctx.fillText('Tap Screen / Drücke Space zum Neustart', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
